name: Trigger External Build

on:
  push:
    branches:
      - main
      - master
  # 如果想让 PR 时也触发，可以加上 pull_request，但这里按你的要求只对主分支 push 触发，所以不需要

jobs:
  webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Send POST request to build server
        run: |
          curl -X POST http://coldmouse.net:15379/build \
            -H "Content-Type: application/json" \
            -d '{"repo": "${{ github.repository_url }}"}'
